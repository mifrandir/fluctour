[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fluctour"
version = "0.1.0"
description = "Local-first, evidence-based travel research with durable Codex jobs"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
fluctour = "fluctour.cli:main"

[tool.setuptools.package-data]
fluctour = ["research.schema.json", "research.activities.schema.json", "preview.html", "assets/*"]
