:root{font:15px/1.5 system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#202e29;background:#f5f5ef;--green:#225843;--muted:#68746d;--line:#dce1d8;--paper:#fffef9}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit;color:inherit}button,summary,select{cursor:pointer}button,a,summary,input,textarea,select{-webkit-tap-highlight-color:transparent}button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #be673d;outline-offset:3px}a{color:var(--green);text-underline-offset:3px}button{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:10px 15px;min-height:44px}button:hover{border-color:var(--green)}button:disabled{opacity:.5;cursor:wait}button.primary{background:var(--green);color:white;border-color:var(--green)}[hidden]{display:none!important}header{max-width:1320px;margin:auto;display:flex;align-items:center;gap:24px;padding:21px 30px;border-bottom:1px solid var(--line)}.brand{font:32px Georgia,serif;letter-spacing:-1.5px;text-decoration:none;color:#223f31}select{margin-left:auto;border:0;background:transparent;max-width:45%;padding:10px 8px;min-height:44px;text-overflow:ellipsis}.workspace{max-width:1320px;margin:30px auto 0;padding:0 30px 50px;display:grid;grid-template-columns:270px minmax(0,1fr);gap:35px}.choices{display:flex;flex-direction:column;gap:12px}.choice{text-align:left;padding:20px;background:transparent}.choice[aria-pressed=true]{background:var(--paper);border-color:var(--green);box-shadow:inset 3px 0 var(--green)}.choice time{font-size:12px;color:var(--muted)}.choice strong{display:block;font-size:19px;margin:7px 0;font-weight:600}.choice small{display:block;color:var(--muted);font-size:12px;line-height:1.6}.detail{min-width:0}h1{font:normal clamp(31px,4vw,45px)/1.1 Georgia,serif;letter-spacing:-1.1px;margin:8px 0 12px}.date{font-size:13px;color:var(--green);font-weight:600}.why{color:var(--muted);max-width:760px;font-size:14px;margin:0 0 18px}.metrics{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 22px}.metric{padding-right:22px;border-right:1px solid var(--line)}.metric:last-child{border:0}.metric small{display:block;color:var(--muted);font-size:11px}.metric strong{font-size:14px;font-weight:550}.map-section{margin:20px 0}.map-switch{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}.map-switch button{padding:7px 11px;font-size:12px;min-height:40px}.map-switch button[aria-pressed=true]{background:#e4ece3;border-color:var(--green)}.map{height:330px;background:#e5e9df;position:relative;overflow:hidden;border:1px solid var(--line);border-radius:10px;touch-action:pan-y}.map{touch-action:none;isolation:isolate}.map:fullscreen,.map.map-expanded{width:100vw!important;height:100dvh!important;border:0;border-radius:0}.map.map-expanded{position:fixed;inset:0;z-index:10000}.map-tools button{display:block;border:0;border-radius:0;width:44px;height:44px;min-height:44px;padding:0;font-size:23px;background:#fff}.map .leaflet-control-zoom a{width:42px;height:42px;line-height:42px}.map .leaflet-control-attribution{font-size:10px}.map .leaflet-pane svg{max-width:none;max-height:none}.map .leaflet-container{font:inherit}.days{display:grid;gap:17px;margin:23px 0}.day{border-top:1px solid var(--line);padding-top:16px}.day h2{font-size:15px;font-weight:600;margin:0 0 12px}.day h2 time{font-size:11px;color:var(--muted);font-weight:400;margin-right:10px}.event{display:grid;grid-template-columns:70px 1fr;gap:12px;padding:6px 0}.event>time{font-variant-numeric:tabular-nums;font-size:12px;color:var(--green);padding-top:2px}.event strong{display:block;font-size:13px;font-weight:550}.event p{margin:2px 0 4px;font-size:12px;color:var(--muted)}details{border-top:1px solid var(--line);padding:15px 0}summary{font-size:13px;min-height:28px}details p,details li{font-size:12px;color:var(--muted)}details ul{padding-left:18px;margin-bottom:0}.flight{display:grid;grid-template-columns:100px 1fr;gap:10px;padding:13px 0;border-bottom:1px solid var(--line);font-size:12px}.flight:last-child{border:0}.flight strong{display:block;font-size:13px}.flight p{margin:3px 0;color:var(--muted)}.status{font-size:11px;color:#956033}.sources{display:grid;gap:10px;margin-top:15px}.sources a{font-size:12px;overflow-wrap:anywhere}.empty{padding:35px 0}.empty h1{font-size:30px}.empty p{color:var(--muted);font-size:13px}.feedback{display:flex;gap:8px;margin-top:12px}.feedback input{min-width:0;flex:1;border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:10px 12px}.feedback button{font-size:13px}.notice{font-size:12px;color:var(--muted);min-height:18px;margin:12px 0 0}dialog{border:1px solid var(--line);border-radius:12px;background:var(--paper);width:min(500px,calc(100% - 30px));padding:25px;color:inherit}dialog::backdrop{background:#1c302c88}dialog h2{font:normal 28px Georgia,serif;margin:0 0 18px}dialog label{font-size:13px;display:block;margin-bottom:8px}textarea{width:100%;min-height:130px;padding:12px;border:1px solid var(--line);border-radius:8px;resize:vertical;background:white}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}#draft{overflow-wrap:anywhere}#draft pre{font:inherit;white-space:pre-wrap}#app-status{max-width:1320px;margin:8px auto 0;padding:0 30px;font-size:11px;color:var(--muted)}
@media(max-width:800px){header{padding:16px 20px;gap:12px}.brand{font-size:29px}.workspace{grid-template-columns:1fr;gap:25px;padding:0 20px 35px;margin-top:21px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.choice{padding:13px}.choice strong{font-size:17px}.choice small{font-size:11px}.map{height:300px}select{font-size:12px}#app-status{padding:0 20px}}
@media(max-width:430px){header{padding:13px 14px;gap:7px}.brand{font-size:27px}header button{font-size:12px;padding:8px 11px}select{max-width:38%;padding-left:0}.workspace{padding:0 14px 30px;gap:22px}.choice time{font-size:10px}.choice strong{font-size:16px}.choice{padding:12px}.choice small{font-size:10px}.map{height:265px}.metric{padding-right:13px}.metrics{gap:9px}.metric strong{font-size:12px}.event{grid-template-columns:60px 1fr;gap:8px}.flight{grid-template-columns:85px 1fr}.why{font-size:13px}#app-status{padding:0 14px}}
.strava-heading{display:flex;justify-content:space-between;align-items:flex-start}.strava-heading button{font-size:22px;padding:0;width:40px;height:40px}.strava-heading h2{margin-top:5px}#strava-body{font-size:13px}#strava-body form{display:grid;gap:12px}#strava-body input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px}.strava-actions{display:flex;gap:10px}.recent-activities>div{padding:10px 0;border-top:1px solid var(--line)}.recent-activities small{display:block;color:var(--muted);margin-top:3px}#strava-button.connected{border-color:#fc4c02;color:#bc3900}header select{min-width:0}
#trip-form>input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px}.date-inputs{display:flex;gap:12px;margin:15px 0}.date-inputs label{width:50%}.date-inputs input{display:block;width:100%;padding:8px 4px;border:1px solid var(--line);border-radius:8px;background:white}.interests{border:0;padding:0;margin:12px 0 18px;display:flex;gap:15px;flex-wrap:wrap}.interests legend{font-size:13px;margin-bottom:7px}.interests label{font-size:12px;margin:0}.interests input{accent-color:var(--green)}#trip-form textarea{min-height:80px}
.route-links{display:flex;flex-wrap:wrap;gap:10px 20px;margin:18px 0;font-size:13px}
.date-field{position:relative;display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:white;overflow:hidden}.date-inputs .date-field>input:not(.date-native){min-width:0;width:calc(100% - 42px);border:0;font-size:13px;font-variant-numeric:tabular-nums;border-radius:0;padding:10px 8px}.date-field button{flex:0 0 42px;width:42px;min-height:44px;border:0;border-left:1px solid var(--line);border-radius:0;padding:0;background:white;font-size:22px}.date-inputs .date-native{position:absolute;bottom:0;right:0;width:1px;height:1px;opacity:0;padding:0;border:0;pointer-events:none}
.date-inputs .date-entry{width:50%;min-width:0}.date-inputs label{width:auto}
.control-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.control-row button{font-size:12px}.filter-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}.filter-row label{font-size:12px}.filter-row input[type=number]{display:block;width:110px;padding:8px;border:1px solid var(--line);border-radius:8px}.trip-kind{display:block;width:100%;max-width:100%;margin:0 0 15px;padding:10px;border:1px solid var(--line);border-radius:8px;background:white}.harness-body{font-size:12px;color:var(--muted)}.harness-body ol{padding-left:20px}.harness-body li{margin:10px 0}.harness-body pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:60vh;overflow:auto;background:#ecefe7;color:var(--ink);padding:14px;border-radius:7px;font:11px/1.6 ui-monospace,monospace;user-select:text}.harness-body details{padding-left:8px}.harness-body button{font-size:12px}
@media(max-width:360px){.date-inputs{flex-direction:column}.date-inputs .date-entry{width:100%}}

<body>
<header><a class="brand" href="/">fluctour</a><select id="trip-select" aria-label="Saved trips"></select><button id="strava-button" aria-label="Strava activities">Strava</button><button id="new-trip" class="primary">+ Trip</button></header>
<p id="app-status" role="status"></p>
<main class="workspace"><nav id="choices" class="choices" aria-label="Proposals"></nav><article id="content" class="detail"></article></main>
<dialog id="trip-dialog" aria-labelledby="dialog-title"><form id="trip-form"><h2 id="dialog-title">New trip</h2><label for="destination">Where?</label><input id="destination" maxlength="100" placeholder="Japan, Taiwan, or surprise me"><div class="date-inputs"><div class="date-entry"><label for="start-date">From</label><span class="date-field"><input id="start-date" type="text" inputmode="numeric" placeholder="DD/MM/YYYY" maxlength="10" pattern="(?:[0-9]{1,2}/[0-9]{1,2}/[0-9]{4}|[0-9]{8})" aria-label="Start date, day/month/year" autocomplete="off"><button type="button" id="start-date-calendar" aria-label="Choose start date" title="Choose start date">▦</button><input id="start-date-picker" class="date-native" type="date" tabindex="-1" aria-hidden="true"></span></div><div class="date-entry"><label for="end-date">Until</label><span class="date-field"><input id="end-date" type="text" inputmode="numeric" placeholder="DD/MM/YYYY" maxlength="10" pattern="(?:[0-9]{1,2}/[0-9]{1,2}/[0-9]{4}|[0-9]{8})" aria-label="End date, day/month/year" autocomplete="off"><button type="button" id="end-date-calendar" aria-label="Choose end date" title="Choose end date">▦</button><input id="end-date-picker" class="date-native" type="date" tabindex="-1" aria-hidden="true"></span></div></div><fieldset class="interests"><legend>Activities</legend><label><input type="checkbox" value="hiking" checked> Hiking</label><label><input type="checkbox" value="swimming" checked> Swimming</label><label><input type="checkbox" value="food"> Food</label><label><input type="checkbox" value="culture"> Culture</label></fieldset><label for="business-anchor">Work visit</label><select id="business-anchor" class="trip-kind"><option value="">Personal trip</option><option value="LON">London work visit</option><option value="NYC">New York work visit</option></select><p id="route-context" class="notice" hidden></p><label for="brief">Notes</label><textarea id="brief" maxlength="6000" placeholder="Private preferences or constraints…"></textarea><p id="create-status" class="notice" role="status"></p><div class="dialog-actions"><button type="button" id="cancel-trip">Cancel</button><button class="primary" id="save-trip">Plan trip</button></div></form></dialog>
<dialog id="strava-dialog" aria-labelledby="strava-title"><div class="strava-heading"><h2 id="strava-title">Strava</h2><button id="close-strava" aria-label="Close Strava">×</button></div><div id="strava-body"></div><p id="strava-message" class="notice" role="status"></p></dialog>
<script type="application/json" id="proposal-data">__FLUCTOUR_DATA__</script>
<script>__FLUCTOUR_MAP_JS__</script>
<script>
'use strict';
const initial=JSON.parse(document.getElementById('proposal-data').textContent);
let current={job:initial.job,researched:initial.researched,trip:initial.trip,options:initial.options||[],constraints:initial.constraints||{},pending_feedback:initial.pending_feedback||[],feedback_effects:initial.feedback_effects||{},budget:initial.budget||{},planning_context:initial.planning_context||{}};
let trips=initial.trips||[],selection=null,mapIndex=0,activeMap=null,mapCleanup=null,requestVersion=0;
let researchPoll=null,planningTripId=null;
const online=location.protocol==='http:'||location.protocol==='https:';
const $=id=>document.getElementById(id);
function node(tag,text,cls){const n=document.createElement(tag);if(text!==undefined&&text!==null)n.textContent=text;if(cls)n.className=cls;return n;}
function safeURL(value){try{const u=new URL(value);return u.protocol==='https:'&&u.hostname&&!u.username&&!u.password?u.href:null;}catch{return null;}}
function link(label,url){const a=node('a',label),safe=safeURL(url);if(safe){a.href=safe;a.target='_blank';a.rel='noopener noreferrer';}return a;}
async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined,cache:'no-store'});let d;try{d=await r.json();}catch{throw Error('Unable to read the server response.');}if(!r.ok)throw Error(d.error||'Unable to save.');return d;}
function setStatus(message){$('app-status').textContent=message;}
function tripList(){const select=$('trip-select');select.replaceChildren();for(const t of trips){const o=node('option',t.brief.length>55?t.brief.slice(0,52)+'…':t.brief);o.value=t.id;select.append(o);}select.value=current.trip?.id||'';select.disabled=!online||!trips.length;}
function researchDetails(container){
 const details=node('details',null,'research-harness');details.id='research';details.append(node('summary','Research'));const body=node('div',null,'harness-body');details.append(body);container.append(details);
 const tripId=current.trip?.id;let loaded=false;
 function code(label,text){const section=node('details');section.append(node('summary',label));const pre=node('pre',text);section.append(pre);return section;}
 details.addEventListener('toggle',async()=>{if(!details.open||loaded)return;loaded=true;body.replaceChildren(node('p','Loading…','notice'));if(!online){body.replaceChildren(node('p','Open the local app to inspect research sessions.','notice'));return;}
 try{const h=await api('/api/trips/'+tripId+'/harness');body.replaceChildren();
 const settings=h.execution_settings||{},budget=h.budget||{};
 body.append(node('p','Codex CLI · fresh session per stage · live web · read-only'));
 const stages=node('ol');for(const stage of settings.stages||['discover','challenge','alternatives']){const item=node('li'),name=node('strong',stage[0].toUpperCase()+stage.slice(1)+' · ');item.append(name,document.createTextNode(h.current_templates.stage_tasks[stage]||''));stages.append(item);}body.append(stages);
 body.append(node('p',new Intl.NumberFormat().format(budget.job_used_or_reserved||0)+' / '+new Intl.NumberFormat().format(budget.job_limit||0)+' tokens used or reserved · '+(budget.sessions_used||0)+' / '+(budget.session_limit||0)+' sessions'));
 body.append(node('p','Month: '+new Intl.NumberFormat().format(budget.monthly_used_or_reserved||0)+' / '+new Intl.NumberFormat().format(budget.monthly_limit||0)+' tokens used or reserved. Unknown usage reserves observed tokens plus 50,000 for the unfinished tail.'));
 if(h.current_public_request)body.append(code('Public request',JSON.stringify(h.current_public_request,null,2)));if(budget.job_used_or_reserved>budget.job_limit||budget.monthly_used_or_reserved>budget.monthly_limit)body.append(node('p','Allowance exceeded. New sessions are blocked.'));body.append(node('p',settings.token_limit_note||'Sessions request a checkpoint before interruption. Late usage events can overshoot the spending guard.'));const templates=node('details');templates.append(node('summary','Current prompt templates'));if(h.current_templates.public_request_brief)templates.append(code('Current public brief',h.current_templates.public_request_brief));for(const [label,key]of [['Base instructions','base_instructions'],['Developer instructions','developer_instructions'],['Finalize instruction','finalize_instructions']])if(h.current_templates[key])templates.append(code(label,h.current_templates[key]));templates.append(code('Research instructions',h.current_templates.instructions),code('Activity plans',h.current_templates.activity_plan_instructions));for(const [stage,task]of Object.entries(h.current_templates.stage_tasks))templates.append(code(stage[0].toUpperCase()+stage.slice(1),task));body.append(templates);
 if(h.runs_truncated)body.append(node('p','Showing the latest 30 of '+(h.runs_truncated+30)+' sessions.'));if(!h.runs.length)body.append(node('p','No Codex sessions recorded for this trip.'));
 for(const run of h.runs){const section=node('details'),known=Number.isInteger(run.usage?.input_tokens)&&Number.isInteger(run.usage?.output_tokens)&&run.usage.input_tokens>=0&&run.usage.output_tokens>=0;section.append(node('summary',run.stage+' · '+run.status+' · '+(known?new Intl.NumberFormat().format((run.usage.input_tokens||0)+(run.usage.output_tokens||0))+' tokens':'usage unknown · '+new Intl.NumberFormat().format((run.usage?.observed_input_tokens||0)+(run.usage?.observed_output_tokens||0))+' observed')));if(run.prompt?.status==='captured'){section.append(node('pre',run.prompt.text));const copy=node('button','Copy prompt');copy.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(run.prompt.text);copy.textContent='Copied';}catch{copy.textContent='Select the prompt to copy';}});section.append(copy);}else section.append(node('p',run.prompt?.status==='not_captured'?'Exact prompt was not recorded for this earlier session.':'The saved prompt is unavailable.'));if(run.settings)section.append(code('Run settings',JSON.stringify(run.settings,null,2)));body.append(section);}
 body.append(code('Execution settings',JSON.stringify(settings,null,2)));
 if(h.current_schemas)body.append(code('Output schemas',JSON.stringify(h.current_schemas,null,2)));
 }catch(error){loaded=false;body.replaceChildren(node('p',error.message,'notice'));}
 });
 if(location.hash==='#research')requestAnimationFrame(()=>details.open=true);
}
function feedback(container){
 researchDetails(container);
 const context=current.planning_context||{},rules=node('details');rules.append(node('summary','Your rules'));for(const fact of context.facts||[])rules.append(node('p',fact));for(const blocker of context.blockers||[])rules.append(node('p',blocker));container.append(rules);
 const details=node('details');details.id='change-plan';details.append(node('summary','Change the plan'));
 const form=node('form',null,'feedback'),input=node('input'),button=node('button','Apply');input.placeholder='At most 2 leave days; no overnight flights';input.setAttribute('aria-label','Feedback');input.required=true;input.maxLength=4000;button.disabled=!online;form.append(input,button);
 const status=node('p',null,'notice');status.setAttribute('role','status');status.id='feedback-status';
 async function apply(payload){const tripId=current.trip.id;button.disabled=true;try{const d=await api('/api/trips/'+tripId+'/feedback',payload);if(current.trip.id!==tripId)return;current=d;render();$('change-plan').open=true;const e=d.feedback_effects||{};$('feedback-status').textContent=e.research_queued?'Saved filters applied. Activity research queued.':e.research_error||'Saved options updated.';scheduleResearchPoll();}catch(error){status.textContent=error.message;}finally{button.disabled=!online;}}
 form.addEventListener('submit',event=>{event.preventDefault();apply({text:input.value});});details.append(form,status);
 const filters=node('form',null,'filter-row'),leave=node('input'),cost=node('input'),overnight=node('input');leave.type=cost.type='number';leave.min=cost.min='0';leave.step='1';cost.step='any';leave.value=current.constraints.max_leave??'';cost.value=current.constraints.max_cost??'';leave.setAttribute('aria-label','Maximum leave days');cost.setAttribute('aria-label','Maximum cost');overnight.type='checkbox';overnight.checked=!!current.constraints.no_overnight;
 for(const [title,field]of [['Max leave days',leave],['Max cost · '+(current.planning_context?.currency||'saved currency'),cost],['No overnight flights',overnight]]){const label=node('label',title);label.append(field);filters.append(label);}const filterButton=node('button','Filter');filterButton.disabled=!online;filters.append(filterButton);filters.addEventListener('submit',event=>{event.preventDefault();const constraints={clear:true,no_overnight:overnight.checked};if(leave.value!=='')constraints.max_leave=Number(leave.value);if(cost.value!=='')constraints.max_cost=Number(cost.value);apply({constraints});});details.append(filters);
 if(Object.keys(current.constraints).length){const clear=node('button','Clear filters');clear.disabled=!online;clear.addEventListener('click',()=>apply({constraints:{clear:true}}));details.append(clear);}
 const effects=current.feedback_effects||{};for(const text of effects.applied||[])details.append(node('p','Applied: '+text));for(const text of effects.pending||[])details.append(node('p','Needs planning: '+text));container.append(details);
}

function render(){setStatus('');if(mapCleanup){mapCleanup();mapCleanup=null;}tripList();const choices=$('choices'),content=$('content');choices.replaceChildren();content.replaceChildren();
if(!current.options.length){selection=null;choices.hidden=true;content.classList.add('empty');content.append(node('h1',['queued','researching','cancelling'].includes(current.job?.status)?'Planning your trip':current.job?.status==='failed'?'Research stopped':current.job?.status==='paused'?'Research paused':current.researched?(current.job?.stage==='no_options'?'No suitable options yet':'No matching proposals'):current.trip?'Plan your trip':'Your next trip'));const brief=node('p',current.trip?.brief||'Create a trip to get started.');brief.id='draft';content.append(brief);if(current.trip){researchControls(content);feedback(content);}return;}
choices.hidden=false;content.classList.remove('empty');if(!current.options.some(o=>o.id===selection))selection=current.options[0].id;
for(const option of current.options){const p=option.plan||{};const b=node('button',null,'choice');b.setAttribute('aria-pressed',String(option.id===selection));b.append(node('time',dateLabel(p.dates)||'Dates to choose'),node('strong',option.destination||option.title),node('small',p.summary||'Open saved research'));b.addEventListener('click',()=>{selection=option.id;mapIndex=0;render();});choices.append(b);}
const option=current.options.find(o=>o.id===selection),plan=option.plan||{};
content.append(node('div',dateLabel(plan.dates)||'Dates to choose','date'),node('h1',plan.title||option.destination||option.title));if(plan.why)content.append(node('p',plan.why,'why'));
const metrics=node('div',null,'metrics'),values=plan.metrics?.length?plan.metrics:[{label:'Personal leave',value:option.assessment?.leave?.days===null?'Unknown':String(option.assessment?.leave?.days??'?')+' days'+(option.assessment?.leave?.provisional?' · provisional':'')},{label:'Total cost',value:option.total_cost===null?'Unknown':option.currency+' '+new Intl.NumberFormat().format(option.total_cost)+(option.cost_complete?'':' · incomplete')}];for(const m of values){const x=node('div',null,'metric');x.append(node('small',m.label),node('strong',m.value));metrics.append(x);}const hikes=activityHistory?.by_type?.Hike;if(hikes?.distance_m?.count&&(plan.metrics?.some(m=>m.label==='Hike')||current.job?.request.activities.includes('hiking'))){const m=node('div',null,'metric');m.append(node('small','Your hikes · median'),node('strong',(hikes.distance_m.median/1000).toFixed(1)+' km'+(hikes.elevation_m?.count?' · +'+Math.round(hikes.elevation_m.median)+' m':'')));metrics.append(m);}if(metrics.childNodes.length)content.append(metrics);
if(plan.maps?.length)renderMapSection(plan.maps,content);if(plan.route_links?.length){const links=node('div',null,'route-links');for(const route of plan.route_links)if(safeURL(route.url))links.append(link(route.title+' ↗',route.url));content.append(links);}

const checks=[...new Set([...(plan.checks||[]),...(plan.local_only?[]:option.assessment?.blockers||[])])];if(checks.length){const details=node('details');details.append(node('summary','Before booking'));const ul=node('ul');for(const check of checks)ul.append(node('li',check));details.append(ul);content.append(details);}
const sources=plan.sources?.length?plan.sources:option.evidence?.map(e=>({title:e.finding,url:e.url}));if(sources?.length){const details=node('details'),items=node('div',null,'sources');details.append(node('summary','Sources · '+sources.length));for(const source of sources)if(safeURL(source.url))items.append(link(source.title,source.url));details.append(items);content.append(details);}
researchControls(content);

function openTripPlanner(tripId=null){planningTripId=tripId;const request=tripId?current.job?.request:null;$('destination').value=request?.destination||'';$('start-date').value=displayDate(request?.start_date||'');$('end-date').value=displayDate(request?.end_date||'');for(const id of ['start-date','end-date']){$(id).setCustomValidity('');$(id+'-picker').value=request?.[id==='start-date'?'start_date':'end_date']||'';}$('business-anchor').value=request?.business_anchor||'';updateRouteContext();$('dialog-title').textContent=tripId?'Change request':'New trip';$('brief').value=tripId?current.trip.brief:'';for(const input of document.querySelectorAll('.interests input'))input.checked=request?request.activities.includes(input.value):['hiking','swimming'].includes(input.value);$('create-status').textContent='';$('trip-dialog').showModal();$('destination').focus();}
function scheduleResearchPoll(){clearTimeout(researchPoll);if(!online||!current.trip||!['queued','researching','cancelling'].includes(current.job?.status))return;const tripId=current.trip.id;researchPoll=setTimeout(async()=>{try{const d=await api('/api/trips/'+tripId);if(current.trip?.id!==tripId)return;const hadOptions=current.options.length;current=d;if(!hadOptions||!['queued','researching','cancelling'].includes(d.job?.status))render();else{const status=$('research-progress');if(status)status.textContent=progressText();}scheduleResearchPoll();}catch(error){if(current.trip?.id===tripId){setStatus(error.message);researchPoll=setTimeout(scheduleResearchPoll,4000);}}},2000);}
function progressText(){const job=current.job,b=current.budget||{};return (job?.message||'Choose dates and activities to start planning.')+(b.job_used_or_reserved?' · '+new Intl.NumberFormat().format(b.job_used_or_reserved)+' / '+new Intl.NumberFormat().format(b.job_limit)+' tokens used or reserved':'');}
function researchControls(container){
 const job=current.job,active=['queued','researching','cancelling'].includes(job?.status),message=node('p',progressText(),'notice');message.id='research-progress';message.setAttribute('role','status');container.append(message);const row=node('div',null,'control-row');container.append(row);
 if(active){const stop=node('button',job.status==='cancelling'?'Stopping…':'Stop research');stop.disabled=!online||job.status==='cancelling';stop.addEventListener('click',async()=>{const tripId=current.trip.id;stop.disabled=true;try{const d=await api('/api/trips/'+tripId+'/cancel',{});if(current.trip?.id!==tripId)return;current=d;render();scheduleResearchPoll();}catch(error){message.textContent=error.message;stop.disabled=false;}});row.append(stop);scheduleResearchPoll();return;}
 const change=node('button',job?.request?'Change request':'Plan trip');change.disabled=!online;change.addEventListener('click',()=>openTripPlanner(current.trip.id));row.append(change);
 if(job?.request){const refresh=job.status==='completed',run=node('button',refresh?'Recheck research':'Resume research');run.disabled=!online;run.addEventListener('click',async()=>{const tripId=current.trip.id;run.disabled=true;try{const d=await api('/api/trips/'+tripId+'/research',refresh?{refresh:true}:{});if(current.trip?.id!==tripId)return;current=d;render();scheduleResearchPoll();}catch(error){message.textContent=error.message;run.disabled=false;}});row.append(run);}
}

function validPoint(p){return Array.isArray(p)&&p.length===2&&p.every(Number.isFinite)&&Math.abs(p[0])<=85&&Math.abs(p[1])<=180;}
function renderMapSection(maps,container){
 const section=node('section',null,'map-section'),switches=node('div',null,'map-switch');
 mapIndex=Math.min(mapIndex,maps.length-1);
 maps.forEach((source,i)=>{const b=node('button',source.title);b.setAttribute('aria-pressed',String(i===mapIndex));b.addEventListener('click',()=>{mapIndex=i;render();});switches.append(b);});
 const element=node('div',null,'map');element.setAttribute('role','region');element.setAttribute('aria-label',maps[mapIndex].title+' map');
 section.append(switches,element);container.append(section);
 const source=maps[mapIndex],segments=(source.segments||[source.points||[]]).filter(Array.isArray).slice(0,20).map(s=>s.filter(validPoint).slice(0,3000)).filter(s=>s.length),points=segments.flat();
 const center=validPoint(source.center)?source.center:points[0];if(!center)return;
 const map=L.map(element,{scrollWheelZoom:true,touchZoom:true,dragging:true,zoomAnimation:!matchMedia('(prefers-reduced-motion: reduce)').matches,minZoom:2,maxZoom:18,attributionControl:true});
 activeMap=map;map.attributionControl.setPrefix(false);
 if(online)L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,referrerPolicy:'origin',attribution:'© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap contributors</a>'}).addTo(map);
 for(const segment of segments){if(segment.length<2)continue;L.polyline(segment,{color:'white',weight:7,interactive:false}).addTo(map);L.polyline(segment,{color:'#205d43',weight:4,interactive:false}).addTo(map);}
 const markers=Array.isArray(source.markers)&&source.markers.length?source.markers.filter(m=>validPoint(m.point)):points.length>1?[{point:points[0],label:'Start'},{point:points[points.length-1],label:'Finish'}]:[{point:center,label:'Beach'}];
 for(const marker of markers)L.circleMarker(marker.point,{radius:6,color:'white',weight:2,fillColor:'#be673d',fillOpacity:1}).addTo(map).bindTooltip(node('span',marker.label),{direction:'top'});
 function fit(){if(points.length>1)map.fitBounds(L.latLngBounds(points),{padding:[35,35],maxZoom:15,animate:false});else map.setView(center,15,{animate:false});}
 fit();
 let fallback=false,savedOverflow='',savedScroll=0;
 const control=L.control({position:'topright'}),buttons=node('div',null,'leaflet-bar map-tools');
 const fullscreen=node('button','⛶'),reset=node('button','⌖');fullscreen.type=reset.type='button';fullscreen.setAttribute('aria-label','Fullscreen map');fullscreen.title='Fullscreen map';fullscreen.setAttribute('aria-pressed','false');reset.title='Fit route';reset.setAttribute('aria-label','Fit route');buttons.append(fullscreen,reset);
 L.DomEvent.disableClickPropagation(buttons);L.DomEvent.disableScrollPropagation(buttons);control.onAdd=()=>buttons;control.addTo(map);
 function expanded(){return fallback||document.fullscreenElement===element;}
 function syncFullscreen(){const open=expanded();fullscreen.textContent=open?'×':'⛶';fullscreen.setAttribute('aria-label',open?'Exit fullscreen map':'Fullscreen map');fullscreen.title=open?'Exit fullscreen map':'Fullscreen map';fullscreen.setAttribute('aria-pressed',String(open));requestAnimationFrame(()=>{if(element.isConnected){map.invalidateSize({pan:false});fullscreen.focus({preventScroll:true});}});}
 function leaveFallback(){if(!fallback)return;fallback=false;element.classList.remove('map-expanded');document.body.style.overflow=savedOverflow;window.scrollTo(0,savedScroll);syncFullscreen();}
 function enterFallback(){savedOverflow=document.body.style.overflow;savedScroll=window.scrollY;fallback=true;element.classList.add('map-expanded');document.body.style.overflow='hidden';syncFullscreen();}
 fullscreen.addEventListener('click',async()=>{if(fallback){leaveFallback();return;}if(document.fullscreenElement===element){try{await document.exitFullscreen();}catch{syncFullscreen();}return;}if(element.requestFullscreen&&document.fullscreenEnabled){try{await element.requestFullscreen();return;}catch{}}if(element.isConnected)enterFallback();});
 reset.addEventListener('click',fit);
 function onKey(event){if(event.key==='Escape'&&fallback){event.preventDefault();leaveFallback();fullscreen.focus({preventScroll:true});}if(event.key==='Tab'&&expanded()){const focusable=[...element.querySelectorAll('a,button,[tabindex="0"]')].filter(n=>n.offsetWidth||n.offsetHeight),first=focusable[0],last=focusable[focusable.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}}
 document.addEventListener('fullscreenchange',syncFullscreen);document.addEventListener('keydown',onKey);
 const observer=new ResizeObserver(()=>map.invalidateSize({pan:false}));observer.observe(element);
 mapCleanup=()=>{leaveFallback();observer.disconnect();document.removeEventListener('fullscreenchange',syncFullscreen);document.removeEventListener('keydown',onKey);if(document.fullscreenElement===element)document.exitFullscreen().catch(()=>{});map.remove();activeMap=null;};
}
function dateLabel(text){return typeof text==='string'?text.replace(/\b\d{4}-\d{2}-\d{2}\b/g,displayDate):'';}
function displayDate(iso){return /^\d{4}-\d{2}-\d{2}$/.test(iso)?iso.slice(8,10)+'/'+iso.slice(5,7)+'/'+iso.slice(0,4):'';}
function dateToISO(text){
 text=text.trim();if(!text)return '';
 const m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(text)||/^(\d{2})(\d{2})(\d{4})$/.exec(text);
 if(!m)throw Error('Use DD/MM/YYYY.');
 const day=Number(m[1]),month=Number(m[2]),year=Number(m[3]),date=new Date(0);date.setUTCFullYear(year,month-1,day);date.setUTCHours(0,0,0,0);
 if(year<1||date.getUTCFullYear()!==year||date.getUTCMonth()!==month-1||date.getUTCDate()!==day)throw Error('Enter a real date in DD/MM/YYYY.');
 return String(year).padStart(4,'0')+'-'+String(month).padStart(2,'0')+'-'+String(day).padStart(2,'0');
}
for(const id of ['start-date','end-date']){
 const text=$(id),native=$(id+'-picker'),button=$(id+'-calendar');
 function validate(){try{const iso=dateToISO(text.value);text.setCustomValidity('');native.value=iso;if(/^\d{8}$/.test(text.value))text.value=displayDate(iso);return iso;}catch(error){text.setCustomValidity(error.message);return null;}}
 text.addEventListener('input',validate);
 text.addEventListener('blur',()=>{const iso=validate();if(iso!==null)text.value=displayDate(iso);});
 native.addEventListener('change',()=>{text.value=displayDate(native.value);text.setCustomValidity('');text.focus({preventScroll:true});});
 button.hidden=typeof native.showPicker!=='function';
 button.addEventListener('click',()=>{try{native.value=dateToISO(text.value);}catch{native.value='';}try{native.showPicker();}catch{text.focus();}});
}
function updateRouteContext(){const city={LON:'London',NYC:'New York'}[$('business-anchor').value],note=$('route-context');note.hidden=!city;note.textContent=city?city+' is included in public route research. Employer rules stay local.':'';}
$('business-anchor').addEventListener('change',updateRouteContext);
$('new-trip').disabled=!online;$('new-trip').addEventListener('click',()=>openTripPlanner());$('cancel-trip').addEventListener('click',()=>$('trip-dialog').close());
$('trip-form').addEventListener('submit',async event=>{event.preventDefault();let startDate,endDate;try{startDate=dateToISO($('start-date').value);endDate=dateToISO($('end-date').value);}catch(error){$('create-status').textContent=error.message;return;}const button=$('save-trip'),research={destination:$('destination').value.trim()||'Surprise me',start_date:startDate,end_date:endDate,activities:[...document.querySelectorAll('.interests input:checked')].map(i=>i.value)},brief=$('brief').value.trim()||[research.destination||'Find a destination',research.start_date,research.end_date,research.activities.join(' + ')].filter(Boolean).join(' · ');if($('business-anchor').value){research.business_anchor=$('business-anchor').value;research.via_city={LON:'London',NYC:'New York'}[research.business_anchor];}button.disabled=true;try{const version=++requestVersion;const created=planningTripId?await api('/api/trips/'+planningTripId+'/research',{research,brief,refresh:true}):await api('/api/trips',{brief,research});if(version!==requestVersion)return;if(!trips.some(t=>t.id===created.trip.id))trips.unshift(created.trip);else trips=trips.map(t=>t.id===created.trip.id?created.trip:t);current=created;selection=null;history.pushState({},'','/?trip='+created.trip.id);$('trip-dialog').close();$('brief').value='';render();setStatus('Research queued.');scheduleResearchPoll();}catch(error){$('create-status').textContent=error.message;}finally{button.disabled=false;}});
async function loadTrip(id,historyMode='push'){const version=++requestVersion;setStatus('Loading…');try{const d=await api('/api/trips/'+encodeURIComponent(id));if(version!==requestVersion)return;current=d;selection=null;mapIndex=0;if(historyMode==='push')history.pushState({},'','/?trip='+d.trip.id);render();setStatus('');scheduleResearchPoll();}catch(error){if(version===requestVersion){setStatus(error.message);tripList();}}}
$('trip-select').addEventListener('change',()=>loadTrip($('trip-select').value));window.addEventListener('popstate',()=>{const id=new URL(location.href).searchParams.get('trip');loadTrip(id||initial.trip?.id,'none');});
let stravaConnection=null,activityHistory=null;
function renderStrava(connection,history){
 if(connection)stravaConnection=connection;if(history)activityHistory=history;
 const c=stravaConnection||{},h=activityHistory||{},body=$('strava-body');body.replaceChildren();
 $('strava-button').classList.toggle('connected',!!c.connected);
 $('strava-message').textContent='';
 if(!c.configured){const p=node('p');p.append(link('Create a Strava API app','https://www.strava.com/settings/api'),document.createTextNode(' · requires a Strava subscription. Callback domain: localhost.'));body.append(p);
 const form=node('form'),id=node('input'),secret=node('input');id.required=secret.required=true;id.inputMode='numeric';id.autocomplete=secret.autocomplete='off';id.setAttribute('aria-label','Strava client ID');id.placeholder='Client ID';secret.type='password';secret.placeholder='Client secret';secret.setAttribute('aria-label','Strava client secret');const button=node('button','Connect Strava','primary');form.append(id,secret,button);form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;try{await api('/api/strava/configure',{client_id:id.value,client_secret:secret.value});secret.value='';await connectStrava();}catch(error){$('strava-message').textContent=error.message;}finally{button.disabled=false;}});body.append(form);
 }else if(!c.connected){const button=node('button',c.needs_reconnect?'Reconnect Strava':'Connect Strava','primary');button.addEventListener('click',connectStrava);body.append(button);
 }else{const actions=node('div',null,'strava-actions'),sync=node('button','Sync activities','primary'),disconnect=node('button','Disconnect');sync.addEventListener('click',syncStrava);disconnect.addEventListener('click',async()=>{try{const d=await api('/api/strava/disconnect',{});renderStrava(d.connection,activityHistory);}catch(error){$('strava-message').textContent=error.message;}});actions.append(sync,disconnect);body.append(actions);}
 if(h.has_history){body.append(node('p',h.count+' activities'+(h.date_range?' · '+dateLabel(h.date_range.first)+' – '+dateLabel(h.date_range.last):'')));for(const [type,stats]of Object.entries(h.by_type||{})){if(!stats.count)continue;const km=stats.distance_m?.median;const elevation=stats.elevation_m?.median;body.append(node('p',type+' · '+stats.count+' recorded'+(km!==null&&km!==undefined?' · median '+(km/1000).toFixed(1)+' km':'')+(elevation!==null&&elevation!==undefined?' · +'+Math.round(elevation)+' m':'')));}
 const recent=node('div',null,'recent-activities');for(const a of h.recent||[]){const row=node('div'),title=a.id?link(a.name||a.type,'https://www.strava.com/activities/'+a.id):node('strong',a.name||a.type);row.append(title,node('small',[dateLabel(a.date),a.location,a.distance_m!==null?(a.distance_m/1000).toFixed(1)+' km':''].filter(Boolean).join(' · ')));recent.append(row);}body.append(recent);
 if(c.partial)body.append(node('p',(c.synced_count||h.count)+' activities read; history is incomplete. Sync again to retry.'));
 }
}
async function connectStrava(){try{$('strava-message').textContent='Opening Strava…';const d=await api('/api/strava/connect',{}),u=new URL(d.url);if(u.origin!=='https://www.strava.com'||u.pathname!=='/oauth/authorize')throw Error('Invalid Strava authorization address.');location.assign(u.href);}catch(error){$('strava-message').textContent=error.message;}}
async function syncStrava(){const buttons=$('strava-body').querySelectorAll('button');buttons.forEach(b=>b.disabled=true);$('strava-message').textContent='Reading activities…';try{const d=await api('/api/strava/sync',{});renderStrava(d.connection,d.history);$('strava-message').textContent=d.connection.partial?'Partial sync. '+(d.connection.fetched_count??d.connection.synced_count??d.history.count)+' activities read; '+(d.connection.retryable?'try again shortly.':'more history remains.'):'Activities updated.';render();}catch(error){$('strava-message').textContent=error.message;}finally{buttons.forEach(b=>b.disabled=false);}}
$('strava-button').disabled=!online;$('strava-button').addEventListener('click',async()=>{$('strava-dialog').showModal();$('strava-message').textContent='Loading…';try{const d=await api('/api/strava');renderStrava(d.connection,d.history);}catch(error){$('strava-message').textContent=error.message;}});$('close-strava').addEventListener('click',()=>$('strava-dialog').close());
async function initStrava(){if(!online)return;try{const d=await api('/api/strava');renderStrava(d.connection,d.history);if(d.history?.has_history)render();if(new URL(location.href).searchParams.get('strava')==='connected'){history.replaceState({},'','/');$('strava-dialog').showModal();await syncStrava();}}catch{}}
initStrava();
